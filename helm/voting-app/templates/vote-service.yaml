apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    app: vote
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.vote.service.type }}
  selector:
    app: vote
  ports:
    - port: {{ .Values.vote.service.port }}
      targetPort: {{ .Values.vote.port }}
      protocol: TCP
