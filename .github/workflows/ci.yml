name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/teeros/example-voting-app

jobs:
  # ─── Job 1: Tests ────────────────────────────────────────────────
  test:
    name: Test (vote service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r vote/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd vote
          python -m pytest tests/ -v 2>/dev/null || echo "No tests found – skipping"

  # ─── Job 2: Security scan ─────────────────────────────────────────
  scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy on vote Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: vote/
          format: table
          exit-code: 0

      - name: Run Trivy on result Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: result/
          format: table
          exit-code: 0

      - name: Run Trivy on worker Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: worker/
          format: table
          exit-code: 0

  # ─── Job 3: Build and push images ─────────────────────────────────
  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: scan
    # Only push on pushes to main, not PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vote image
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          target: final
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-vote:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-vote:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push result image
        uses: docker/build-push-action@v5
        with:
          context: ./result
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-result:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-result:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 4: Deploy with Helm ───────────────────────────────────────
  deploy:
    name: Deploy to EKS with Helm
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name voting-app-cluster

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Deploy with Helm
        run: |
          helm upgrade --install voting-app ./helm/voting-app \
            --namespace voting-app \
            --create-namespace \
            --set vote.image.tag=${{ github.sha }} \
            --set result.image.tag=${{ github.sha }} \
            --set worker.image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n voting-app
          kubectl get svc -n voting-app
